[[task]]
  id = "t-5"
  wave = 1
  title = "Read ADO branch policies as push protection"
  files = ["internal/ship/azuredevops_policy.go", "internal/ship/azuredevops_policy_test.go", "internal/ship/hostguard_test.go", "internal/cmd/hermetic_env_test.go"]
  description = """
ADOBranchProtection(opts, branch), GETs only via adoRequest: reads the repo (id, defaultBranch) and
_apis/policy/configurations. Protected iff a non-deleted, enabled, blocking config has a scope with repositoryId null or
this repo whose refName matches refs/heads/<branch> exactly or as prefix (case-insensitive), or matchKind DefaultBranch
names this branch; a scope with no refName does not count. Read failure or truncated list → Known=false with a reason.
adoMergeCommitAllowed(target) reads blocking "Require a merge strategy" policies for t-9. Seam: ship.ADOBranchProtectionFunc.
Locked ado_branch_protection: read only.
"""
  covers = ["c-10"]
  test_contract = ["if scoping is wrong, TestADOBranchProtectionScopes fails: protected for {enabled, blocking, Exact refs/heads/main, this repo} on main and for {Prefix refs/heads/milestone/, repositoryId null} on milestone/v1.8; refs/heads/Main protects main; matchKind DefaultBranch protects main but not milestone/v1.8; unprotected when the only config has isBlocking false, isEnabled false, isDeleted true, another repositoryId, a repo-wide scope with no refName, or Exact refs/heads/main checked against milestone/v1.8", "if a failed read reads as unprotected, a 401, a 500, a 203 sign-in page, non-JSON, a body without value and a full $top page each give Known=false with a reason naming the policy read, never Known=true/unprotected", "if merge-commit policy is misread, a blocking merge-strategy policy with allowNoFastForward false on main gives allowed=false; allowNoFastForward true, or no such policy, gives true; an unreadable list gives known=false", "if dross writes a policy, TestADOBranchProtectionReadOnly fails when any request recorded across these tests is not a GET", "if the host check is skipped, the new azure-devops branch-policy row of TestShipRefusesOffAllowlistAPIBase sees fake-host hits or a reason without the host refusal", "if the new seam can dial from cmd tests, TestHermeticBranchProtection_NeverDials fails unless stubBranchProtection sets ship.ADOBranchProtectionFunc to Known=true, unprotected"]
  status = "done"

[[task]]
