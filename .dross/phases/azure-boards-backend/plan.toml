  title = "Read ADO process metadata and work items"
  files = ["internal/forge/azureboards_meta.go", "internal/forge/azureboards_meta_test.go", "internal/redact/redact_test.go"]
  description = """
Lazy, per-client cached reads: requirement type from <project>/_apis/work/backlogconfiguration (requirementBacklog default
type; locked hierarchy), type names, each type's states with categories in API order, PathExists(area | iteration) via
classificationnodes (404 = missing). GetIssue GETs workitems/<id>?$expand=relations (no fields param), mapping title,
description, System.Tags (dross-vocabulary tags lowercased), System.State. Resolved / State closed iff category Completed,
so Removed reads open and unresolved.
"""
  covers = ["c-2", "c-3", "c-9"]
  test_contract = [
    "if the requirement type is guessed, TestADORequirementTypeFromBacklogConfig fails: Agile / Scrum / Basic fixtures yield User Story / Product Backlog Item / Issue and a custom \"Customer Request\" yields that name; a 500 or a body without requirementBacklog errors naming the backlog configuration (never a \"User Story\" fallback); a second call makes no request",
    "if categories are misread, TestADOStatesByCategory fails: GET .../workitemtypes/Product%20Backlog%20Item/states (escaped once) yields New/Approved Proposed, Committed InProgress, Done Completed, Removed Removed, in API order; a second call makes zero requests",
    "if close truth comes from the name, TestADOGetIssueResolved fails: Done (Completed) reads Resolved=true, closed, WorkflowState Done; Resolved (category Resolved) and Removed read Resolved=false, open",
    "if tag casing breaks identity, System.Tags \"Dross; DROSS/phase:p; Bug\" reads back as Labels [dross, dross/phase:p, Bug], so HasMarker is true",
    "if a bad key reaches the wire, GetIssue(\"PROJ-7\") errors with zero requests; a 404 errors (never nil, nil); the request carries $expand=relations and no fields param",
    "if a missing path reads as present, TestADOCheckPaths fails: area `Fabrikam\\Web` and `Web` both GET .../classificationnodes/Areas/Web; `Fabrikam` alone GETs .../Areas; iteration `Fabrikam\\Sprint 1` GETs .../Iterations/Sprint%201; 404 → missing; 500 or 203 → error, never \"missing\"",
    "if the scrub is removed, the AzureBoardsClient row of TestEveryForgeClientRedacts fails: a canary token echoed by the server never appears in GetIssue's error",
  ]
  status = "done"

