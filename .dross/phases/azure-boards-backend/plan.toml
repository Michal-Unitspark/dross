  depends_on = ["t-6"]
  title = "Resolve ADO states by category"
  files = ["internal/forge/azureboards_state.go", "internal/forge/azureboards_state_test.go", "internal/forge/state_map_test.go", "internal/boardsync/board_lifecycle_divergence_test.go"]
  description = """
defaultADOStateCategory: plain map[string]string literal keyed by LifecycleStatuses (AST-readable). planned → Proposed;
in-progress, task-in-progress → InProgress; uat, task-in-review → Resolved (InProgress where the type has none); shipped,
complete, task-complete → Completed. Written state = first state of that category in type order, never Removed;
[board].state_map overrides by name (locked state_resolution). SetState: zero PATCH if already there; warn + no PATCH + nil
when unreachable, override names a missing state, or 400 rule rejection; 500 errors. CloseIssueAs refuses before writing
when the target is not Completed-category, else PATCH, re-read, error naming the id unless Completed; CloseIssue =
CloseIssueAs("complete"). SetStateRaw writes the literal and verifies read-back (EqualFold); a 400 is an error.
StateWriter asserted. Phases lane gets one complete/shipped exemption carrying its why (shipped → Completed, as Jira).
"""
  covers = ["c-3", "c-4", "c-6"]
  test_contract = [
    "if defaults become per-process tables, TestADODefaultStateResolution fails on any row: Scrum PBI in-progress→Committed, uat→Committed, planned→New (not Approved), complete→Done; Scrum Task task-in-progress→In Progress, task-in-review→In Progress, task-complete→Done; Agile User Story in-progress→Active, uat→Resolved, complete→Closed; Agile Task task-in-review→Active; Agile Epic complete→Closed; Basic Issue in-progress→Doing, uat→Doing, complete→Done",
    "if a default lands in Removed, a table over Agile/Scrum/Basic × every LifecycleStatuses member never resolves to a Removed-category state",
    "if the override is ignored or trusted blindly, state_map {in-progress: Approved} PATCHes System.State Approved on a PBI; {in-progress: Doing} on Basic beats the default; an override naming a state the Task type lacks warns on stderr naming the status, the item and the state, sends zero PATCH and returns nil",
    "if an unreachable state fails the sync, planned on a type with no Proposed state warns and returns nil with zero PATCH; a 400 TF401320 rule rejection warns and returns nil; a 500 returns an error; an item already in the target makes zero PATCH",
    "if a close is trusted unread, TestADOCloseIssueAsVerifies fails: read-back Done → nil; a 200 PATCH whose read-back is Active errors naming work item 42 and the written state; a read-back GET 500 errors; override {complete: Resolved} on an Agile User Story, or a blank complete override, errors naming the id with zero PATCH",
    "if undo goes through the map, TestADOSetStateRawLiteral fails: SetStateRaw(\"42\",\"Resolved\") PATCHes Resolved verbatim and a read-back of Closed errors naming 42; a 400 on the write errors (unlike SetState); the azure-devops rows of TestSetStateRawBypassesTheStateMap and TestSetStateRawVerifiesReadBack pass",
    "if a key goes missing or the lifecycle collapses, the azure-devops rows of TestStateMapsKeyExactlyTheEmittedStatuses, TestStateMapsKeepTheLifecycleStatesDistinct (uat ≠ shipped), TestEveryReapTerminalIsMapped and TestLaneTerminalStatesAreDistinctWithinTheirLane fail on defaultADOStateCategory; the last passes only with one azure-devops Phases complete/shipped exemption that carries its why",
  ]
  status = "done"

