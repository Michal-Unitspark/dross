  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Build Azure Boards transport and constructor"
  files = ["internal/forge/forge.go", "internal/forge/azureboards.go", "internal/forge/azureboards_test.go", "internal/secretscan/sinks.go"]
  description = "forge.Config gains APIVersion, AreaPath, IterationPath. NewAzureBoards checks in order: base_url, project, auth_env (each\nnamed), api_version shape (default 7.1), base_url shape (exported CheckADOBaseURL; a Server URL needs its collection),\nhostallow — only then os.Getenv; no request. It normalizes area_path / iteration_path once: a value that is neither the\nproject name nor starts with `<project>\\` gets the project prefixed, so the doctor probe and every create use the same full\npath. doRaw: secretscan.ScanPayload before encoding, exactly one api-version, Basic \":\"+PAT (Bearer under bearer),\nX-TFS-FedAuthRedirect: Suppress, no redirects, 203/3xx = sign-in error, redact.Scrub on every body, json-patch+json for\nwork-item writes. doRaw registered as Screened in secretscan.Transports."
  covers = ["c-1"]
  test_contract = ["if a field check is dropped, TestNewAzureBoardsNamesMissingFields fails: empty base_url, project or auth_env each errors naming [board].base_url / [board].project / [board].auth_env while the env is unset, with zero requests; api_version \"7.1&x=1\", \"7.1#x\" and \"../7.1\" error naming [board].api_version before any Getenv", "if the token is read before the host check, TestNewAzureBoardsRefusesHostBeforeToken fails: base_url https://attacker.example with auth_env unset gives errors.Is(err, hostallow.ErrRefused), never \"is not set\"; with a sentinel env set, the sentinel never appears in the error", "if Services or Server URLs are mishandled, TestADOBoardBaseURLShapes fails: https://dev.azure.com/acme, https://acme.visualstudio.com, https://acme.visualstudio.com/DefaultCollection and https://tfs.corp.example/tfs/DefaultCollection are accepted and keep their collection path; https://dev.azure.com and https://dev.azure.com/acme/Proj are refused naming the https://dev.azure.com/<org> form", "if URLs double-escape, project \"Scratch project\" builds /acme/Scratch%20project/_apis/... (never %2520), and an endpoint already carrying api-version=5.0 goes out with exactly one api-version, the configured one", "if the credential drifts, TestADOBoardRequestShape fails: default, basic and private-token send Basic base64(\":\"+PAT) even with AuthUser set; bearer sends \"Bearer <PAT>\"; every request carries api-version=7.1 by default (6.0 when set) and X-TFS-FedAuthRedirect: Suppress", "if the credential can leak, a 400 body echoing the PAT and base64(\":\"+PAT) yields an error containing neither; a 302 to a second httptest server records zero hits there; a 203 errors naming $AUTH_ENV", "if the transport is unregistered or unscreened, TestEveryOutboundSeamIsRegistered and TestScreenPrecedesRequestInEveryScreenedTransport (internal/cmd) report forge.AzureBoardsClient.doRaw", "if a bare Server host is accepted, TestADOBoardBaseURLShapes fails: https://tfs.corp.example (no collection) is refused naming the <host>/<collection> form", "if paths reach ADO unprefixed, TestADOBoardPathNormalization fails: on project Fabrikam, area_path `Web` becomes `Fabrikam\\Web`, iteration_path `Sprint 1` becomes `Fabrikam\\Sprint 1`, and `Fabrikam` and `Fabrikam\\Web` stay unchanged"]
  status = "done"

