  test_contract = ["if the payload drifts, TestADOArmChoreAutoComplete fails: exactly one PATCH to .../pullrequests/41 whose autoCompleteSetBy.id equals connectionData's authenticatedUser id and whose completionOptions.mergeStrategy is \"noFastForward\"; bypassPolicy absent or false, no bypassReason; no recorded body anywhere carries bypassPolicy true", "if a forbidden merge commit is armed, a blocking \"Require a merge strategy\" config on the target with allowNoFastForward false, or an unreadable policy list, gives errors.Is(err, ErrAutoMergeUnavailable) and zero PATCH", "if a refusal is mishandled, a 400 or 403 on the PATCH gives ErrAutoMergeUnavailable; a 500 gives a plain error that is not ErrAutoMergeUnavailable", "if the outcome is guessed, read-back completed → Merged; active with autoCompleteSetBy → AutoEnabled; active without it, or a 200 PATCH answer lacking autoCompleteSetBy, is never AutoEnabled", "if the phase-PR rule regresses, TestADOCompletePayload still bans autoCompleteSetBy in the phase completion body", "if another method is armed or the dispatch is mis-ordered, method \"squash\" on azure-devops errors with zero requests, and AutoMergePR on a github OpenOpts still reaches the gh auto-merge path while sending zero requests to any ADO host", "if the host check is skipped, the azure-devops auto-complete row of TestShipRefusesOffAllowlistAPIBase sees zero fake-host hits and ErrRefused"]
  status = "done"

