  description = """
AutoMergePR gains an azure-devops arm accepting method "merge" only. It checks the target's merge-strategy policy via t-5;
forbidding or unreadable → ErrAutoMergeUnavailable, nothing written. Otherwise PATCH pullrequests/<n> with
