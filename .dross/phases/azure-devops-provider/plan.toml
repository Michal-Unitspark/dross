[[task]]
  id = "t-6"
  wave = 2
  title = "Read ADO PR status and dedupe by source"
  files = ["internal/ship/azuredevops_pr.go", "internal/ship/azuredevops_pr_test.go", "internal/ship/headpr.go", "internal/ship/headpr_test.go"]
  description = "azureDevOpsPRStatus: Merged only when status == completed; BaseRef = targetRefName minus refs/heads/.\nadoOpenPRBySource queries active PRs by sourceRefName and re-checks source, status and forkSource client-side.\nFindOpenPRByHead gains the azure-devops arm; the stale deferred-arm comment goes. Response structs stay\nfunction-local even where status and dedupe share a PR shape (no not_paths.txt rows; t-7 owns that file in wave 2).\n"
  covers = ["c-6", "c-8", "c-2"]
  depends_on = ["t-1", "t-3"]
  test_contract = ["if abandoned or active reads as merged, TestAzureDevOpsPRStatusMapping fails: completed and Completed give Merged true; abandoned and active give false", "if an unknown status reads as not-merged, the test fails: an empty or missing status, a non-JSON body or a 404 returns an error, never PRStatus{} with nil; PRNumber 0 errors with 0 requests", "if refs/heads/ is not stripped or is stripped twice, refs/heads/release/x stops giving release/x, and a retargeted PR stops reporting its current targetRefName", "if the filter is misnamed or unescaped, TestFindOpenPRByHeadAzureDevOps fails: the mock asserts searchCriteria.sourceRefName == refs/heads/phase/x (a head with & or + round-trips) and searchCriteria.status == active; hit 17 gives {17, <canonical>/pullrequest/17}; an empty value list gives (nil, nil)", "if the server filter is trusted blindly, a mock that ignores the query and returns PRs from refs/heads/other, an abandoned phase/x and a forkSource phase/x stops giving (nil, nil)", "if a failed lookup reads as none or unsupported, the test fails: a 500, a 203 sign-in page and an unparseable body each return an error that is not errors.Is(ErrHeadPRLookupUnsupported)", "if Server addressing breaks for status, a /tfs/DefaultCollection remote stops reading /tfs/DefaultCollection/P/_apis/git/repositories/R/pullRequests/<n> with api-version", "if a package-level tagged PR struct lands in internal/ship, TestEveryPathShapedFieldIsDeclared goes red at this commit (structs stay function-local; not_paths.txt belongs to t-7)"]
  status = "done"

