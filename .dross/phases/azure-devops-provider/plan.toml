[[task]]
  id = "t-1"
  wave = 1
  title = "Parse ADO remotes into canonical identity"
  files = ["internal/project/azuredevops.go", "internal/project/azuredevops_test.go", "internal/project/remote.go", "internal/project/remote_test.go"]
  description = """
Exported ParseAzureDevOpsRemote(raw) -> {URL, APIBase, Base, Project, Repo, Services}, fed internally by
parseGitRemote's taint-cleared (host, path); parseGitRemote moves to EscapedPath so %-encoded names survive.
Host-aware one-segment rule per the amended repo_identity lock. Pure — no callers yet.
"""
  covers = ["c-1", "c-2"]
  test_contract = ["if a Services form mis-canonicalizes, TestParseAzureDevOpsRemote fails: git@ssh.dev.azure.com:v3/o/p/r, ssh://git@ssh.dev.azure.com/v3/o/p/r, https://o@dev.azure.com/o/p/_git/r and .../r.git each give url https://dev.azure.com/o/p/_git/r and api_base https://dev.azure.com/o", "if userinfo leaks, the https://o:PAT@dev.azure.com/o/p/_git/r row fails when URL or APIBase contains PAT", "if the one-segment rule ignores an org-carrying host, TestParseAzureLegacyHostCarriesOrg fails: o.visualstudio.com/p/_git/r gives api_base https://o.visualstudio.com and project p; o.visualstudio.com/DefaultCollection/p/_git/r gives api_base https://o.visualstudio.com/DefaultCollection; o@vs-ssh.visualstudio.com:v3/o/p/r gives https://o.visualstudio.com/p/_git/r (never dev.azure.com)", "if percent-encoding is decoded or doubled, https://dev.azure.com/o/My%20Project/_git/My%20Repo stops round-tripping byte-identical (no raw space, no %2520), Project stops being 'My Project', or its ssh v3 twin diverges", "if Server depth or port handling breaks, rows fail: https://tfs.corp/tfs/DefaultCollection/P/_git/R gives api_base https://tfs.corp/tfs/DefaultCollection; host-root https://tfs.corp/Coll/P/_git/R gives https://tfs.corp/Coll; ssh://tfs.corp:22/... drops the port; :8443 is kept", "if the repo == project rule breaks, https://dev.azure.com/o/_git/r stops giving project r and repo r", "if malformed input half-parses, TestParseAzureRejects fails: no _git, _git last, an empty segment, a . or .. segment, dev.azure.com/_git/r and github.com/x/y each return ok=false", "if the host predicate is a substring match, TestAzureServicesHost fails: evil-visualstudio.com, visualstudio.com.evil.example and dev.azure.com.evil.example are all false", "if EscapedPath alters a non-ADO remote, the existing TestDetectRemote and TestDetectRemoteDropsUserinfo rows fail", "if the zero-segment legacy form breaks, https://o.visualstudio.com/_git/r stops giving project r, repo r and api_base https://o.visualstudio.com", "if EscapedPath changes non-ADO canonicalization unnoticed, a new TestDetectRemote row with an encoded segment fails: https://gitlab.com/o/My%20Repo must canonicalize keeping %20 single-encoded (no raw space, no %2520)"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add ADO PAT rule and known hosts"
  files = ["internal/secretscan/rules.go", "internal/secretscan/secretscan_test.go", "internal/hostallow/hostallow.go", "internal/hostallow/hostallow_test.go"]
  description = """
New azure-devops-pat rule: 76 alnum + AZDO + 4 alnum, word-bounded, needle AZDO; fixtures built at runtime so
the repo self-scan stays clean; randomLine gains its generator arm. hostallow saasDefaults gain dev.azure.com,
vssps.dev.azure.com and *.visualstudio.com.
"""
  covers = ["c-9", "c-4"]
  test_contract = [
    "if the rule or its corpus row is missing, TestEveryRuleHasAHitCase fails (the row must give exactly one azure-devops-pat hit), TestRedactCoversEveryRule fails to redact it, and TestEveryRuleHasNeedles fails if AZDO is dropped",
    "if randomLine has no azure-devops-pat arm, prefilterSeeds and TestReportNeverEchoesTheValue panic with 'no generator for rule' (both iterate Rules())",
    "if the anchor is loose, AZDO at position 75 or 77, an 83- or 85-char run, and lowercase azdo each give zero hits",
    "if a reference trips the rule, a benign row fails: <your-pat>, $AZURE_DEVOPS_EXT_PAT, auth_env = AZURE_DEVOPS_EXT_PAT and a bare 52-char [a-z2-7] string give zero hits, while token = <the same 52 chars> still gives exactly one key-context hit",
    "if a sink stops screening, ScanPayload of {title: PAT} and {body: PAT} stops returning ErrHit, or Scan of a project.toml line holding the PAT stops hitting",
    "if a host is missing or the wildcard is loose, TestADOBuiltinHosts fails: dev.azure.com, vssps.dev.azure.com, o.visualstudio.com and o.vssps.visualstudio.com are accepted; evil-visualstudio.com, visualstudio.com.attacker.example, bare visualstudio.com, x.dev.azure.com, o.visualstudio.com:8443 and http://dev.azure.com are refused with ErrRefused",
  ]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Build ADO REST transport with single credential"
  files = ["internal/ship/azuredevops.go", "internal/ship/azuredevops_test.go", "internal/ship/open.go", "internal/ship/comment.go", "internal/secretscan/sinks.go", "internal/ship/redact_test.go"]
  description = "adoRequest is the only ADO HTTP entry: hostallow check before the token read, secretscan.ScanPayload before\nhttp.NewRequest, exactly one auth header, a validated api-version (default 7.1), FedAuthRedirect: Suppress, no\nredirect following, redact.Scrub on every body. OpenOpts/CommentOpts gain APIVersion. The sinks.go and\nscrubbingHelpers registrations are guard-forced into this task. Error/response structs stay function-local\n(no not_paths.txt rows).\n"
  covers = ["c-4"]
  test_contract = ["if a second or wrong credential leaks, TestAzureDevOpsAuthHeader fails: schemes empty, private-token and ' BASIC ' each send exactly one Authorization: Basic base64(':'+tok) and no PRIVATE-TOKEN; bearer sends Authorization: Bearer tok", "if the host check moves after the getenv, TestAzureDevOpsRefusesBeforeTokenRead fails: a policy derived from https://dev.azure.com/o/p/_git/r with an httptest api_base gives ErrRefused, 0 hits, neither token nor env name in the error, and still refuses with the env unset; TestNoGetenvOutsideHostguard fails if azuredevops.go calls os.Getenv", "if api-version is missing, duplicated or injectable, TestAzureDevOpsAPIVersionOnEveryCall fails: empty gives 7.1; 6.0 and 7.1-preview.1 pass through; a URL already carrying ?searchCriteria.status=active keeps exactly one api-version; 7.1&x=y, 7.1#, a blank and ../ error with 0 requests before the env read", "if a sign-in page reads as success, TestADOSignInIsAuthFailure fails: a 203 HTML page and a 302 are both auth errors, and the 302 target sees 0 requests", "if the scrub is dropped, a mirrorAuthServer 401/403 echoing the token and base64(':'+tok) leaks either value into the error; a body holding a ghp_ token is refused with 0 hits", "if adoRequest is unregistered, TestEveryOutboundSeamIsRegistered and TestScreenPrecedesRequestInEveryScreenedTransport (internal/cmd) and TestShipHelpersScrubAtSource fail naming adoRequest", "if names are double- or un-escaped, TestADORepoEndpointEscapesOnce fails: ('My Project', 'My Repo') gives My%20Project/_apis/git/repositories/My%20Repo, never %2520, and # and ? are escaped", "if config is empty, an empty api_base or auth_env errors naming [remote].api_base / [remote].auth_env with 0 requests", "if auth_user leaks into the credential, a TestAzureDevOpsAuthHeader row with AuthUser me stops sending exactly Authorization: Basic base64(':'+tok) (never base64('me:'+tok))"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 2
  title = "Open ADO PR with optional reviewers"
  files = ["internal/ship/azuredevops_open.go", "internal/ship/azuredevops_open_test.go"]
  description = """
openAzureDevOpsPR POSTs .../{project}/_apis/git/repositories/{repo}/pullrequests, then one PUT .../reviewers/<id>
{isRequired:false} per reviewer — a GUID as-is, else an Identities lookup at adoIdentityBase. Description capped
at 4000 runes with a truncation note. Response structs stay function-local (no not_paths rows).
"""
  covers = ["c-5", "c-2"]
  depends_on = ["t-1", "t-3"]
  test_contract = [
    "if the create body is wrong, TestOpenAzureDevOpsPRPayload fails: sourceRefName refs/heads/phase/x (an already-prefixed head is not doubled), targetRefName refs/heads/main, title with no Draft: prefix, description; Draft=true sends isDraft:true, Draft=false sends no isDraft key; no reviewers key in the create body",
    "if the API url is recorded instead of the browser URL, TestOpenAzureDevOpsPRResultURL fails: pullRequestId 42 gives https://dev.azure.com/o/p/_git/r/pullrequest/42 with My%20Repo single-encoded; a missing pullRequestId and a 409 TF401179 each give (nil, err)",
    "if Server addressing breaks, a /tfs/DefaultCollection remote stops posting to /tfs/DefaultCollection/P/_apis/git/repositories/R/pullrequests",
    "if reviewer resolution is wrong, TestOpenAzureDevOpsPRReviewers fails: for [<GUID>, alice@corp.example] exactly one identities GET (searchFilter=General&filterValue=<escaped>), the GUID is never looked up, and two PUTs carry isRequired:false",
    "if a reviewer failure turns fatal, TestOpenAzureDevOpsPRReviewerFailureNonFatal fails: identities 404/500, 0 matches, 2 matches (ambiguous, skipped) and a reviewer PUT 500 each return (result{Number:42}, err naming the reviewer but not the token) and the remaining reviewers are still added; a create 500 returns (nil, err)",
    "if the identity host is wrong, TestAzureDevOpsIdentityBase fails: dev.azure.com/o and o.visualstudio.com map to https://vssps.dev.azure.com/o; https://tfs.corp/tfs/Coll maps to itself",
    "if a long body is sent raw, TestOpenAzureDevOpsPRLongDescription fails: the sent description is at most 4000 runes, ends in a truncation note and does not split a multi-byte rune",
  ]
  status = "done"

