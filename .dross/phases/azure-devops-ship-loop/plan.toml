[[task]]
  id = "t-3"
  wave = 1
  title = "Define CI verdicts and the ADO rollup"
  files = ["internal/ship/ci.go", "internal/ship/azuredevops_ci.go", "internal/ship/azuredevops_ci_test.go"]
  description = """
ci.go: CIVerdict (pass|fail|pending|none|ask), CIResult{Verdict, Link, Reason, Queued}, ErrCIUnsupported; no window
logic in Go. azuredevops_ci.go: pure adoCIRollup(builds, evals) over untagged observation types, counting builds plus
Build (0609b952-...) and Status (cbdc66da-...) policy evaluations (blocking and optional) by type id; notApplicable
skipped. Precedence fail > running > ask (expired build policy, broken, unknown) > queued > none > pass;
partiallySucceeded = fail. No I/O.
"""
  covers = ["c-5"]
  test_contract = [
    "if a failure is masked, TestADORollupFail fails: a failed, canceled or partiallySucceeded build, or a rejected Build/Status evaluation, gives fail even alongside succeeded, running and queued items, with Link set to that item's link; a rejected optional (isBlocking=false) Build evaluation still fails",
    "if a non-CI policy counts, a rejected Required reviewers (fd2167ab-...), Minimum reviewers (fa4e907d-...), Comment requirements (c6a1889d-...) or Work item linking (40e92b44-...) evaluation alone gives none and next to a succeeded build gives pass; a displayName 'Build' on a reviewer type id is not counted and a Build type id with displayName 'Compilacion' is counted",
    "if notApplicable counts, a lone notApplicable evaluation gives none and notApplicable plus a succeeded build gives pass",
    "if an unfinished state reads green: running build + approved evaluation gives pending (Queued false); queued + inProgress gives pending (Queued false); notStarted/postponed builds or queued evaluations alone give pending (Queued true); an expired build evaluation (context.isExpired) gives ask even while queued; a broken evaluation or unknown build result gives ask; zero counted items gives none; none of these is ever pass",
    "if precedence depends on order, every TestADORollup* row gives the same verdict under every permutation of its items",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 1
  title = "Define merge outcomes and the ADO completion"
  files = ["internal/ship/merge.go", "internal/ship/azuredevops_merge.go", "internal/ship/azuredevops_merge_test.go"]
  description = """
merge.go: MergeResult{URL}, ErrMergeBlocked, ErrMergeUnsupported. adoCompletePR(opts, sha) GETs the PR first:
completed => merged with 0 writes; abandoned, isDraft or lastMergeSourceCommit != sha => refuse with 0 writes. Else one
PATCH {status completed, lastMergeSourceCommit.commitId sha, completionOptions {mergeStrategy squash, squashMerge true,
deleteSourceBranch false, transitionWorkItems false}}, then polls to status completed on a test-lowerable interval
bounded at ~90s so one Bash call never outlives its timeout.
"""
  covers = ["c-6"]
  test_contract = [
    "if the body drifts, TestADOCompletePayload fails: exactly one PATCH to .../pullrequests/7 with status completed, lastMergeSourceCommit.commitId == sha, mergeStrategy squash, squashMerge true, deleteSourceBranch present and false, transitionWorkItems false; a recursive JSON walk finds no bypassPolicy, bypassReason or autoCompleteSetBy key at any depth",
    "if provider-side teardown sneaks in, any DELETE or any request under .../refs fails the test",
    "if the pin is skipped, lastMergeSourceCommit bbb with sha aaa (error names both), an abandoned PR and an isDraft PR each error with 0 PATCHes; an already-completed PR returns merged with 0 PATCHes (idempotent re-run)",
    "if a merge preview reads as merged, GETs answering active+queued, active+succeeded, then completed report merged only at completed after 3 polls; mergeStatus conflicts errors naming conflicts, failure errors, rejectedByPolicy gives errors.Is(err, ErrMergeBlocked); a PATCH 400/409 errors with ADO's scrubbed message and 0 polls; polls exhausted while active error 'completion not confirmed - re-run dross ship merge'; none of these returns a MergeResult",
  ]
  status = "pending"

