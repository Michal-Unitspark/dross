    "if status maps loosely, TestADOPRHeadOpen fails: active and Active give Open true; completed and abandoned give false; an empty, missing or unknown status ('notSet') returns an error, never PRHead{Open:false}",
    "if refs/heads/ handling breaks, refs/heads/phase/x gives Ref phase/x and refs/heads/phase/a/b gives phase/a/b; an empty sourceRefName or one outside refs/heads/ (refs/pull/3/merge) returns an error",
    "if a fork reads as same-repo, forkSource {name: refs/heads/phase/x} gives CrossRepo true while forkSource null and an absent key give false; PRNumber 0 sends 0 requests",
    "if the dependents filter is trusted blindly, TestADOOpenPRsTargeting fails: the mock asserts targetRefName == refs/heads/milestone/v1.8 (a base with & or + round-trips) and status active; a server that also returns a PR into refs/heads/main and an abandoned PR yields only the real dependent with number, title, browser URL and HeadRefName without refs/heads/; a fork PR into the base is still listed; an empty base errors with 0 requests",
    "if a failed lookup reads as 'no dependents', a 500, a 203 sign-in page, a non-JSON body, a body without a value array and a pullRequestId 0 each return (nil, err); a genuine empty value list returns (empty, nil)",
    "if truncation hides a dependent, a full 100-PR page with no client-side match returns an error, and a full page containing a match returns that match",
  ]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Define CI and merge outcomes, ADO rollup"
  files = ["internal/ship/ci.go", "internal/ship/merge.go", "internal/ship/azuredevops_ci.go", "internal/ship/azuredevops_ci_test.go"]
  description = "ci.go: CIVerdict (pass|fail|pending|none|ask), CIResult{Verdict, Link, Reason, Queued}, ErrCIUnsupported; no window\nlogic in Go. merge.go: MergeResult{URL}, ErrMergeBlocked, ErrMergeUnsupported. azuredevops_ci.go: policy type-id\nclassification (CI = Build 0609b952-..., Status cbdc66da-...; blocking-non-CI = reviewers, comments, work items)\nshared with t-4, and pure adoCIRollup(builds, evals) counting builds plus CI evaluations (blocking and optional);\nnotApplicable skipped. Precedence fail > running > ask (expired build policy, broken, unknown) > queued > none >\npass; partiallySucceeded = fail. No I/O.\n"
  covers = ["c-5"]
  test_contract = ["if a failure is masked, TestADORollupFail fails: a failed, canceled or partiallySucceeded build, or a rejected Build/Status evaluation, gives fail even alongside succeeded, running and queued items, with Link set to that item's link; a rejected optional (isBlocking=false) Build evaluation still fails", "if a non-CI policy counts, a rejected Required reviewers (fd2167ab-...), Minimum reviewers (fa4e907d-...), Comment requirements (c6a1889d-...) or Work item linking (40e92b44-...) evaluation alone gives none and next to a succeeded build gives pass; a displayName 'Build' on a reviewer type id is not counted and a Build type id with displayName 'Compilacion' is counted", "if notApplicable counts, a lone notApplicable evaluation gives none and notApplicable plus a succeeded build gives pass", "if an unfinished state reads green: running build + approved evaluation gives pending (Queued false); queued + inProgress gives pending (Queued false); notStarted/postponed builds or queued evaluations alone give pending (Queued true); an expired build evaluation (context.isExpired) gives ask even while queued; a broken evaluation or unknown build result gives ask; zero counted items gives none; none of these is ever pass", "if precedence depends on order, every TestADORollup* row gives the same verdict under every permutation of its items", "if the policy classifier drifts, TestADOPolicyClass fails: Build and Status type ids classify as CI; Required reviewers, Minimum reviewers, Comment requirements and Work item linking classify as blocking-non-CI with their display names; an unknown type id is neither", "if the classifier matches by prefix, TestADOPolicyClass fails: Minimum reviewers fa4e907d-c16b-4a4c-9dfa-4906e5d171dd is blocking-non-CI while Require a merge strategy fa4e907d-c16b-4a4c-9dfa-4916e5d171ab is neither; every type id is matched in full, case-insensitively"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 2
  title = "Complete ADO PRs and detect policy blocks"
  files = ["internal/ship/azuredevops_merge.go", "internal/ship/azuredevops_merge_test.go"]
  description = "adoCompletePR(opts, sha) GETs the PR first: completed => merged with 0 writes; abandoned, isDraft or\nlastMergeSourceCommit != sha => refuse with 0 writes. Else one PATCH {status completed, lastMergeSourceCommit.commitId\nsha, completionOptions {mergeStrategy squash, squashMerge true, deleteSourceBranch false, transitionWorkItems false}},\nthen polls to status completed on a test-lowerable interval bounded at ~90s. On a refused PATCH (400/409) or a PR\nstill active at the bound, reads the PR's policy evaluations (withPreview, t-3 classifier): an unapproved blocking\nnon-CI policy => ErrMergeBlocked naming it; mergeStatus rejectedByPolicy => ErrMergeBlocked; else a plain error.\n"
  covers = ["c-6"]
  test_contract = ["if the body drifts, TestADOCompletePayload fails: exactly one PATCH to .../pullrequests/7 with status completed, lastMergeSourceCommit.commitId == sha, mergeStrategy squash, squashMerge true, deleteSourceBranch present and false, transitionWorkItems false; a recursive JSON walk finds no bypassPolicy, bypassReason or autoCompleteSetBy key at any depth", "if provider-side teardown sneaks in, any DELETE or any request under .../refs fails the test", "if the pin is skipped, lastMergeSourceCommit bbb with sha aaa (error names both), an abandoned PR and an isDraft PR each error with 0 PATCHes; an already-completed PR returns merged with 0 PATCHes (idempotent re-run)", "if a merge preview reads as merged, GETs answering active+queued, active+succeeded, then completed report merged only at completed after 3 polls; mergeStatus conflicts errors naming conflicts, failure errors, rejectedByPolicy gives errors.Is(err, ErrMergeBlocked); none of these returns a MergeResult", "if a policy block is read as a plain failure, TestADOCompletionBlockedByPolicy fails: a PATCH 400 (TF401027-style 'You need at least 1 approving reviewer') with an unapproved blocking Required reviewers evaluation, and an accepted PATCH whose PR is still active at the bound with an unapproved Comment requirements evaluation, each give errors.Is(err, ErrMergeBlocked) with the policy's display name in the message; the evaluations request carries the preview api-version", "if every refusal is called a block, a PATCH 400/409 or still-active-at-bound with no unapproved blocking non-CI evaluation (only Build/Status, or all approved) gives a plain error carrying ADO's scrubbed message or 'completion not confirmed - re-run dross ship merge', never ErrMergeBlocked; a failed evaluations read also gives a plain error", "if t-4's evaluations read targets the wrong PR, TestADOCompletionBlockedByPolicy's mock asserts artifactId == vstfs:///CodeReview/CodeReviewId/<repository.project.id>/7 escaped once (a project-name or double-escaped artifactId gets no evaluations and the row fails)"]
  status = "done"
  depends_on = ["t-1", "t-3"]

