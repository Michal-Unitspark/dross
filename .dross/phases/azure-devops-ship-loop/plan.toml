[[task]]
  id = "t-1"
  wave = 1
  title = "Read ADO threads and caller identity"
  files = ["internal/ship/azuredevops_threads.go", "internal/ship/azuredevops_threads_test.go", "internal/ship/azuredevops_identity.go", "internal/ship/azuredevops_identity_test.go"]
  description = """
azureDevOpsPRComments GETs .../pullRequests/<n>/threads with no status filter; keeps non-deleted text and codeChange
comments, skips system (string or numeric commentType) and deleted comments/threads. threadContext.filePath (leading /
stripped) + rightFileStart.line (else leftFileStart.line) => inline, else conversation. ID = <threadId><commentId %05d>
(digits only, prtriage grammar untouched); URL = <repo browser url>/pullrequest/<n>?discussionId=<thread>; author id
lowercased, Bot unknown. azureDevOpsAuthenticatedUser GETs <api_base>/_apis/connectionData via adoConn.withPreview
(defined here, reused by t-9). Decode structs function-local. Not dispatched yet (t-8).
"""
  covers = ["c-1", "c-3"]
  test_contract = [
    "if ids collide, TestADOThreadCommentIDs fails: thread 1/comment 12 and thread 11/comment 2 give distinct ids (100012 vs 1100002); thread 7/comment 1 and thread 8/comment 1 give 700001 and 800001; every id matches ^[0-9]+$; a comment id of 0 or > 99999 returns (nil, err)",
    "if noise leaks, TestADOThreadsSkipNoise fails: a commentType 'system' (and numeric 3) vote, a RefUpdate push, a status change, an isDeleted thread and an isDeleted comment contribute 0 comments; 'text', 1 and 'codeChange' are kept; threads of status fixed, closed, wontFix, byDesign and pending are all listed and the threads request carries no status filter",
    "if anchoring breaks, TestADOThreadInlineAnchor fails: /src/a.go + rightFileStart.line 12 gives inline Path src/a.go Line 12; leftFileStart-only gives its line; a file-level context gives Path with Line 0; no threadContext gives conversation with empty Path",
    "if a partial list escapes, a thread with id 0, a non-JSON body, a body without a value array, a 500 and a 203 sign-in page each return (nil, err), never the threads decoded before the fault",
    "if the bot class is guessed, a 'Project Collection Build Service' author or an isContainer author still gives Bot unknown; URL is https://dev.azure.com/o/p/_git/r/pullrequest/7?discussionId=42 (browser form, single-encoded)",
    "if identity hits the wrong base, TestADOAuthenticatedUserEndpoint fails: api_base https://dev.azure.com/o requests /o/_apis/connectionData (no project segment), Server /tfs/Coll requests /tfs/Coll/_apis/connectionData; configured 7.1 sends 7.1-preview.1, 6.0 sends 6.0-preview.1, 7.1-preview.1 is not double-suffixed",
    "if an anonymous answer reads as dross, an authenticatedUser with id aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa or no id returns an error, never Account{}",
    "if id case diverges, TestADOIdentityMatchesThreadAuthor fails: connectionData id 'AB12...' and thread author id 'ab12...' give equal Account.ID and CommentAuthor.ID; Login is properties.Account.$value, else providerDisplayName",
  ]
  status = "pending"

