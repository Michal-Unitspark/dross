[[task]]
  id = "t-7"
  wave = 1
  title = "Add the live-smoke record and its honesty check"
  files = ["internal/ship/testdata/ado_live_smoke.toml", "internal/ship/ado_live_record_test.go"]
  description = "Record template whose TOML comments are the runbook. Prerequisites: a scratch ADO repo with dross init; a pipeline\n(YAML or classic) plus an agent that can run it (hosted grant or self-hosted); a phase on phase/<id> with a verify\npass; a hand-set comment-resolution policy on its base; an inline comment posted by hand before the listing step;\nreviewer threads resolved before the merge step. Then the 11 c-7 steps, each not-run, posture 'mock-only'. Posture is\nmock-only | partial | live. The validator owns every per-step evidence rule t-18 relies on; record struct\ntest-local; ReplyMarker matched as a literal (internal/ship cannot import prtriage). Backs c-7 only.\n"
  covers = ["c-7"]
  test_contract = ["if mock can be filed as live, TestADOLiveRecordHonest fails when posture = 'live' while any step is not-run or fail, or lacks evidence (an ADO URL or id), run_at or api_version", "if httptest evidence is passed off as live, a step whose evidence names 127.0.0.1, localhost or an httptest port is rejected", "if a step is dropped, the test fails unless all 11 step keys appear exactly once", "if the thread fallback is ignored, statusless_thread_blocks = true while adoThreadStatus is still '' fails the test", "if the validator is vacuous, its in-test fixtures live-with-gap, mock-only and complete-live give reject, accept-as-mock and accept-as-live respectively", "if a hollow leg can pass, TestADOLiveRecordStepEvidence fails unless each step's pass requires its evidence: dedupe = a 'found open PR #N' line; listing = an inline comment with non-empty path and line > 0; head = phase/<id>, open, not cross-repo; user = an id equal to dross's thread author id; respond = a reply thread whose body starts with the ReplyMarker literal and is dropped from the next listing; ci = the verdict verbatim plus a build URL on the real ADO host; merge = non-empty ls-remote output for phase/<id>; merged-status = merged", "if a failed run reads as live, a record with any step fail gives posture 'partial' accepted only as partial, never live; 'partial' with every step pass is rejected", "if the runbook loses its prerequisites, the test fails unless the template's comments name dross init on a scratch ADO repo, a pipeline plus a runnable agent, a verify pass on phase/<id>, the hand-set comment-resolution policy, a hand-posted inline comment, and resolving reviewer threads before the merge step"]
  status = "done"

