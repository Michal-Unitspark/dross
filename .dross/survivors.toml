[[category]]
  name = "gremlins-attribution-ceiling"
  reason = "gremlins reports these lines NOT COVERED although the test suite provably executes them. Proven by TestAttributionCeilingIsReal in internal/mutation/ceiling_test.go: a live `go test -coverprofile` run over the internal/mutation/testdata/ceiling fixture reports count>=1 on a switch-case condition line, while the gremlins report recorded for that same fixture marks the same line NOT COVERED. go-cover's block for a case arm begins at the colon, so the condition's own columns belong to no block, and gremlins — which only builds mutants on lines the profile shows as covered — concludes the line never ran. These entries are switch-case conditions and closure bodies. Adding tests cannot kill them, because the tests already run them."

[[category]]
  name = "const-initializer-arithmetic"
  reason = "A package-level declaration initializer — a const, or a var whose composite literal is built at init — is evaluated before any instrumented statement runs, so go-cover emits no coverage block for its line at all: not a block with count 0, no block. Gremlins only builds and runs mutants on lines the profile shows as covered, so such a line's mutant is never compiled, never run, and can never be killed by any test a caller could write. Proven by TestConstInitializerHasNoCoverageBlock in internal/mutation/ceiling_test.go (the fixture's const line sits in no block while its statement lines do) and by TestNoCoverageBlockIsNotACoverageGap in internal/survivor/evidence_test.go, which pins the distinction from an ordinary coverage gap — a gap is a block that never ran, and a test can close it. Distinct from the attribution ceiling: there the line runs and the tool disagrees; here the line is structurally uninstrumentable."

[[category]]
  name = "curated-table-tiebreak"
  reason = "Unreachable given the curated data, not untested: CuratedMisreaches sorts by command path and only falls back to comparing tokens when two entries SHARE a path. All four curated entries have distinct command paths, so sort.Slice never invokes the tie-break. Pinned by TestCuratedMisreachPathsAreDistinct, which also asserts the primary path ordering — add a second entry under an existing path and that test fails, making the tie-break reachable and owing a real ordering test instead of this reason."

[[category]]
  name = "tty-secret-entry"
  reason = "Unreachable without a TTY on stdin: `dross env set` reads the secret with term.ReadPassword(int(os.Stdin.Fd())), which fails outright when stdin is not a terminal, and the guard immediately above returns that error — so no line after it can run. term.ReadPassword is called directly on the real fd with no seam to inject a pty, and a Go test binary never has one. TestEnvCover_SetReadPasswordErrorsOnNonTTY pins the reachable half: the command fails cleanly rather than storing an empty or garbage secret. Remove or seam that read and these lines become reachable and owe tests rather than this reason."

[[category]]
  name = "self-replacing-binary-path"
  reason = "Unreachable in a test by construction: this block runs only when updateOpts.targetPath is empty, and it resolves the target to os.Executable() — which, under `go test`, is the running test binary. update.AtomicReplace would then overwrite the test binary mid-run, so every test in update_test.go (TestUpdateAppliesAndResyncs and its siblings) must pass an explicit targetPath, and the default-resolution branch is skipped by all of them. The branch is real in production and untestable in-process; exercising it would destroy the process exercising it."

[[category]]
  name = "gremlins-switch-case-ceiling"
  reason = "gremlins reports a switch{} case-condition as NOT-COVERED even when a test exercises that arm — a go-cover attribution limit, not a test gap. Classify's arms are asserted code-by-code in TestClassifyReadsTheCodeNotTheProse and TestClassifyKeepsTransportApartFromTheProgram."

[[category]]
  name = "exec-seam-guard"
  reason = "The 'if stdin != \"\"' guard lives inside the process-construction seam (launcherCommand) that every remote test replaces, so executing it would mean spawning the real ssh — the one thing those tests exist to avoid. Its effect is asserted instead of its line: TestRemoteEnvExportsPrecedeTheCommand and TestGremlinsRemoteRunOrderAndArgv both read the script back off the recorded stdin, which is only there because this branch attaches it, and TestRemoteNilCarriesNoScript pins the empty-stdin side."

[[category]]
  name = "shadowed-range-boundary"
  reason = "An equivalent mutant, not a coverage gap: this arm is `case code < 0 || code > 255` in laneSelectorProblems, and the two arms above it already match code == 0 and code == 255 exactly. CONDITIONALS_BOUNDARY can only widen `<` to `<=` or `>` to `>=`, and both widenings admit only the two values the earlier cases have already consumed — so no input reaches the mutated comparison and no assertion can distinguish the mutant from the original. Killing it would require deleting the explicit 0 and 255 arms, which exist to give each code its own refusal message (TestValidateRejectsUnusableEmptyExitCodes asserts the distinct needles \"success code\", \"transport-failure\" and \"0-255\" per code). The reachable half of this arm is covered: the out-of-range case drives 300 through dross validate and asserts the 0-255 refusal."

[[category]]
  name = "detach-seam-body"
  reason = "The body of a `var detach* = func(...)` process-construction seam in internal/cmd/verify.go — detachSync, detachStatus, detachCancel. Every test in verify_detach_test.go, verify_results_test.go and verify_status_test.go replaces the whole var, so these bodies never execute: a live `go test -coverprofile ./internal/cmd` on 2026-08-31 reports count 0 for every block covering lines 167, 363, 367 and 568-573. Executing them would mean spawning real ssh, because remote.commandFn — the transport seam these bodies bottom out in — is unexported and unreachable from package cmd, and the phase's locked tests_spawn_no_ssh decision forbids a test that needs a host. Their effect is asserted instead of their line: the stubs return the same errors the real bodies would propagate, and TestResultsOnAnUnreachableHostIsNotAVerdict, TestDispatchPushesBeforeItStarts and TestCancelAgainstAnUnreachableHostStillClearsButSaysSo pin what the caller does with them. Move the seam boundary below remote.Exec, or export a transport stub from internal/remote, and these become reachable and owe tests rather than this reason."

[[category]]
  name = "gremlins-switch-case"
  reason = "gremlins attributes no go-cover block to a bare `switch { case ... }` case-condition, so every arm reports NOT_COVERED even when a test drives it. Validate's arms are each exercised by TestValidateNamesEveryMalformedShape with a written-down expected message (no disposition, >1 disposition, blank Carrier, empty Why, no Writer, no SourcedFrom, duplicate name). Tooling attribution limit, not a test gap — see dross_gremlins_switchcase_ceiling."

[[category]]
  name = "gremlins-var-initializer"
  reason = "the `+` is string-literal concatenation inside `var fields = []Field{...}`, the package-level registry. gremlins attributes no go-cover block to a package-level var initializer, so every operator in the declaration reports NOT_COVERED. There is nothing a test could assert to kill it either: the operands are constant prose, and what the registry must hold is asserted structurally by TestRegistryPinsEveryDeclaredField (name + disposition + count) and by Validate's non-empty Why/Writers rules, not by matching the prose verbatim."

[[category]]
  name = "host-lock-switch-case"
  reason = "gremlins attributes no go-cover block to a bare switch{}/select{} case-condition, so each arm reports NOT_COVERED even when a test drives it — a tooling attribution limit, not a test gap (see dross_gremlins_switchcase_ceiling). The host-lock arms here are each asserted: verify.go scheduledReason/status arms by TestStatusNamesWhatAScheduledRunWaitsOn, TestScheduledByOwnRunIDIsNotWaiting, TestScheduledWithFreeLockSaysNotStarted, TestEmptyRecordIsNamedAsSuch, TestLockReadErrorKeepsStatusUseful and TestStatusPointsAFinishedRunAtTheCollectVerb; test.go holdHostForSuite arms by TestExpiredWaitSpawnsAnywayNamingTheHolder, TestMissingFlockWarnsAndRuns and TestTestHoldsAcrossSyncAndSuite; doctor.go reportHostLock arms by TestDoctorReportsMissingFlockAsHostTool, TestDoctorNamesTheCurrentHolder and TestDoctorFreeLockIsOneLine; hold.go event arms by TestMissingFlockIsNamed, TestAcquirePrintsTheHolderOnce, TestAcquireExpiredRunsAlongside and TestReleaseClosesStdinThenWaits (the 2s select timeout); lock.go LockPrelude wait forms by TestLockPreludeWaitForms and TestRealBoundedWaitRunsAlongside, and ParseLockStatus arms value-by-value by TestParseLockStatus."

[[category]]
  name = "host-lock-var-initializer"
  reason = "A package-level var initializer (launcherHeartbeat = 5*time.Minute, holdKeepalive = 30*time.Second, holderLull = 300*time.Millisecond) is evaluated at init before any instrumented statement, so go-cover emits no block for its line and gremlins reports every operator in it NOT_COVERED. The values are tuning knobs the tests deliberately shrink (TestVanishedLaptopFreesWithinTheLease, TestAcquireHeartbeatsWhileWaiting, TestLauncherRoutesWaitLinesToItsLog set them via the var), so the initializer's arithmetic is never what a test observes; the wiring that reads them is what is asserted. Tooling attribution limit, not a test gap."

[[category]]
  name = "host-lock-seam-body"
  reason = "The body of a `var x = func(...)` process-construction seam — testHold (internal/cmd/test.go), remoteLockStatusFn (internal/cmd/doctor.go), launcherHold (internal/mutation/launcher.go). Each wraps remote.Acquire / remote.ExecScript, which spawn a real ssh hold session; every test replaces the whole var (installHoldRecorder, fakeLockStatus, recordHold) so the body never executes and the err != nil guard reports NOT_COVERED. Same class as the accepted detach-seam-body entries in verify.go: the effect is asserted instead of the line — TestSuiteFailureStillReleases, TestMissingFlockWarnsAndRuns, TestDoctorSkipsLockStatusWithoutFlock, TestBusyRefusalSpawnsNothing and TestUnlockableHostIsNeverMeasuredOn pin what each caller does with the error the real body would propagate. Move the seam boundary below remote.Exec and these become reachable and owe tests rather than this reason."

[[category]]
  name = "scanner-no-progress-guard"
  reason = "A no-progress guard in internal/shellscan's parser loops — parseList's `if p.pos == start`, and parseCommand's `if p.pos == before` after parseRedirect and after readWord: when an iteration consumed nothing it fails the scan and steps one byte, so a future grammar gap degrades to Partial instead of looping forever. No input reaches one today: parseList hands every byte to a branch that consumes it, atRedirect only returns true where parseRedirect will consume an operator from redirOps, and readWord only stalls on a metacharacter parseCommand has already dispatched. Checked 2026-10-03 by fuzzing (FuzzScan, 53.6M executions, ~1,100 new interesting inputs) a copy of the package with each guard replaced by a panic: none fired. The mutants here only change what an unreachable branch does (the string-concatenation ARITHMETIC_BASE is not even viable). Keep the guards; if one is ever reached, TestFuzzSeedsNeverPanic and the fuzz harness's Partial/Problem invariant are where it shows."

