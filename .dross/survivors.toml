  text = "panic(\"secretscan: no \" + pemRuleName + \" rule\")"
  line = 108
  accepted_in = "review-comment-ingest"
  reason = "Unreachable while the rules table holds the pem-private-key rule: pemRule() scans the package-level rules slice and returns on the first name match, so its trailing panic runs only if that rule were deleted. Every PEM redaction reaches pemRule through redactOnce and pemHit, and TestRedactPEMWhole asserts the [redacted pem-private-key] marker and a hit named pem-private-key, so deleting the rule fails that test long before this panic could run. The mutant itself swaps a string + for an operator Go strings do not define, so it would not compile even on a reached line."

