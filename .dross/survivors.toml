  text = "n++"
  line = 122
  reason = "Unreachable, not untested: utf16Len ranges over a Go string, and range decoding never yields a rune utf16.RuneLen rejects — an invalid UTF-8 sequence, including a UTF-8-encoded surrogate, decodes to utf8.RuneError (U+FFFD, one UTF-16 unit), and no decoded rune exceeds unicode.MaxRune. So RuneLen(r) > 0 for every r and the else-branch's n++ never runs; its coverage block is count 0 by construction and no test can kill the mutant. The live branch (1- and 2-unit runes) is pinned by TestOpenAzureDevOpsPRLongDescription; the else-branch is a defensive guard against RuneLen's documented -1, kept so the function stays correct if it is ever fed runes from another source."
